name: bai1-rag

# Settings and credentials come from .env (copy .env.example; needs Compose >= 2.24 for the optional env_file).
# Without .env the stack still starts on the fallbacks below, which are fit for a first local try only; services
# are not published outside localhost. Set real values in .env for any shared machine.
# Endpoints default to the services in this file; set S3_ENDPOINT, DATABASE_URL, REDIS_URL or CHROMA_HOST/PORT
# in .env to use external or managed ones instead.
x-app: &app
  image: bai1-rag:local
  init: true
  env_file:
    - path: .env
      required: false
  environment:
    # Inside Docker the database URL is always built from these parts (any password character is escaped).
    # A DATABASE_URL left in .env for running outside Docker (often pointing at localhost) is ignored here;
    # for an external/managed PostgreSQL set POSTGRES_HOST / POSTGRES_PORT (and the credentials) in .env.
    DATABASE_URL: ""
    POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
    POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    POSTGRES_USER: ${POSTGRES_USER:-rag}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_dev_password}
    POSTGRES_DB: ${POSTGRES_DB:-rag}
    S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rag_dev_access}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-rag_dev_secret_change_me}
    S3_BUCKET: ${S3_BUCKET:-documents}
    CHROMA_HOST: ${CHROMA_HOST:-chroma}
    CHROMA_PORT: ${CHROMA_PORT:-8000}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    HF_HOME: /app/.cache/huggingface
  # Ollama runs on the Windows host, not in a container.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - model_cache:/app/.cache
    # Session signing secret generated by `init` when AUTH_SECRET is not set in .env.
    - app_secrets:/run/app-secrets
  shm_size: 1gb

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # S3-compatible object storage for original files (MinIO no longer ships public images).
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rag_dev_access}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rag_dev_secret_change_me}
      S3_BUCKET: ${S3_BUCKET:-documents}
    entrypoint: ["/bin/sh", "/seaweedfs-start.sh"]
    volumes:
      - s3_data:/data
      - ./docker/seaweedfs/start.sh:/seaweedfs-start.sh:ro
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:1.5.9
    volumes:
      - chroma_data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Ingest job queue (RQ). Job state of record lives in PostgreSQL; the worker re-queues lost jobs.
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: migrations, storage checks, signing secret and the optional first admin account.
  init:
    <<: *app
    command: ["python", "-m", "scripts.init_services"]
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      chroma:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  # Background ingest: OCR, chunking, embedding. Models load once at start.
  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, redis, os; from rq import Worker; sys.exit(0 if Worker.all(connection=redis.Redis.from_url(os.environ['REDIS_URL'])) else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    restart: unless-stopped

  api:
    <<: *app
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Built React app served by nginx; /api and /health are proxied to the api service (same origin).
  frontend:
    build: ./frontend
    image: bai1-rag-frontend:local
    ports:
      # 127.0.0.1 = this machine only; set FRONTEND_BIND=0.0.0.0 in .env to serve the office network.
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  model_cache:
  app_secrets:
  pg_data:
  s3_data:
  chroma_data:
  redis_data:
