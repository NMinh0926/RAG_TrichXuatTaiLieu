# Serves the built SPA and reverse-proxies the API on the same origin (no CORS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    # pdf.js worker is an ES module: it must be served with a JavaScript MIME type.
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
    }

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Resolve the api service at request time (Docker DNS), so nginx starts even before the API does.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://api:8000;

    # Server-Sent Events (chat answers, job progress) must reach the browser unbuffered.
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /health {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback; index.html itself is always revalidated.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
